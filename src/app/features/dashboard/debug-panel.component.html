@if (externalControl()()) {
  <div class="debug-panel premium-card">
    <div class="panel-header">
      <div class="flex items-center gap-2">
        <mat-icon class="color-primary">terminal</mat-icon>
        <span class="panel-title">E2E Flow Simulator</span>
      </div>
      <button class="btn-icon-sm" (click)="externalControl().set(false)">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="panel-content">
      <!-- NFON CTI Status -->
      <div class="debug-section nfon-status-section">
        <label class="section-label">NFON CTI Status</label>
        <div class="nfon-status-badge" [ngClass]="nfonStatusClass()">
          <mat-icon>{{ nfonStatusIcon() }}</mat-icon>
          <span>{{ nfonStatusLabel() }}</span>
        </div>
        @if (!nfonConnected()) {
          <p class="status-tip">
            <mat-icon>info</mat-icon>
            Für das echte NFON fügen Sie die Zugangsdaten in der
            <code>appsettings.json</code> hinzu.
          </p>
        }
      </div>

      <div class="debug-section">
        <label class="section-label">Simulation (Mock)</label>
        <button class="btn btn-primary w-full" (click)="triggerCall()" [disabled]="isLoading()">
          <mat-icon>mic</mat-icon>
          Incoming Call (Real Mic)
        </button>
      </div>

      <div class="debug-section mt-4">
        <label class="section-label">AI Intelligence</label>
        <button
          class="btn btn-secondary w-full"
          (click)="triggerSummary()"
          [disabled]="!activeCallId()"
        >
          <mat-icon>auto_awesome</mat-icon>
          AI Draft Ready
        </button>
        @if (!activeCallId()) {
          <p class="status-tip">
            <mat-icon>info</mat-icon>
            Join an active call first
          </p>
        }
      </div>
    </div>
  </div>
}
