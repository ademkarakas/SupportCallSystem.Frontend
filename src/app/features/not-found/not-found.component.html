<div [class]="isAuthenticated() ? 'not-found-layout-view' : 'not-found-page'" [@fadeIn]>
  <div class="not-found-content" [@scaleIn]>
    <div class="error-code">404</div>
    <mat-icon class="error-icon">search_off</mat-icon>
    <h1 class="error-title">Seite nicht gefunden</h1>
    <p class="error-description">Die angeforderte Seite existiert nicht oder wurde verschoben.</p>
    <div class="error-actions">
      <button class="btn btn-secondary" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        Zurück
      </button>
      <a routerLink="/dashboard" class="btn btn-primary">
        <mat-icon>home</mat-icon>
        Zur Startseite
      </a>
    </div>
  </div>
</div>
